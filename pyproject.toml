[tool.poetry]
name = "safety-chat-bot"
version = "0.6.0"
description = "AI-powered Telegram moderation and community bot"
authors = ["Admin <contact@srvrs.top>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
aiogram = "^3.4.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.29"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.14.2"
structlog = "^24.1.0"
aiohttp = "^3.14.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"